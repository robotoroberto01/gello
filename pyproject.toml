[project]
name = "gello"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.11.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "ocp-vscode>=3.3.4",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "trimesh>=5.1.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
